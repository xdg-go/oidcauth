version: "2"

# Defaults (errcheck, govet, ineffassign, staticcheck, unused) plus:
linters:
  enable:
    - gosec
    - misspell
  exclusions:
    rules:
      # Test helpers mint throwaway RSA keys and fake tokens.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
